<div class="container">
    <header>
        <h1>{{ isEditing() ? 'Edit Article' : 'New Article' }}</h1>
    </header>

    <div class="card">
        <form [formGroup]="articleForm" (ngSubmit)="onSubmit()">
            <div>
                <label for="title">Title</label>
                <input id="title" type="text" formControlName="title" placeholder="Article Title">
            </div>

            <div>
                <label for="content">Content</label>
                <textarea id="content" formControlName="content" rows="10"
                    placeholder="Write your thoughts..."></textarea>
            </div>

            <div class="actions">
                <button type="button" class="btn-secondary" (click)="cancel()">Cancel</button>
                <button type="submit" class="btn" [disabled]="articleForm.invalid || loading">
                    {{ loading ? 'Saving...' : 'Save Article' }}
                </button>
            </div>
        </form>
    </div>
</div>
