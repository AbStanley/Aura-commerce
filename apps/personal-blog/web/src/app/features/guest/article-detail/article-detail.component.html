<div class="container">
    @if (article(); as article) {
    <article class="card article-full">
        <header>
            <h1>{{ article.title }}</h1>
            <p class="date">{{ article.publishedDate | date:'fullDate' }}</p>
        </header>
        <div class="content">
            {{ article.content }}
        </div>
        <footer>
            <a routerLink="/" class="btn-secondary">&larr; Back to Home</a>
        </footer>
    </article>
    } @else {
    <p>Loading article...</p>
    }
</div>
