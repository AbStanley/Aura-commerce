apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway
  namespace: ecommerce
  labels:
    app: api-gateway
spec:
  replicas: 2
  selector:
    matchLabels:
      app: api-gateway
  template:
    metadata:
      labels:
        app: api-gateway
    spec:
      containers:
      - name: api-gateway
        image: ghcr.io/abstanley/ecommerce/api-gateway:latest
        ports:
        - containerPort: 8080
        envFrom:
        - configMapRef:
            name: ecommerce-config
        - secretRef:
            name: ecommerce-secrets
        env:
        - name: ReverseProxy__Clusters__user-service__Destinations__destination1__Address
          value: "http://user-service:8080"
        - name: ReverseProxy__Clusters__product-service__Destinations__destination1__Address
          value: "http://product-service:8080"
        - name: ReverseProxy__Clusters__cart-service__Destinations__destination1__Address
          value: "http://cart-service:8080"
        - name: ReverseProxy__Clusters__order-service__Destinations__destination1__Address
          value: "http://order-service:8080"
        - name: ReverseProxy__Clusters__payment-service__Destinations__destination1__Address
          value: "http://payment-service:8080"
        - name: ReverseProxy__Clusters__notification-service__Destinations__destination1__Address
          value: "http://notification-service:8080"
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "256Mi"
            cpu: "500m"
        readinessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 10
          periodSeconds: 5
        livenessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 30
          periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: api-gateway
  namespace: ecommerce
spec:
  selector:
    app: api-gateway
  ports:
  - port: 80
    targetPort: 8080
  type: ClusterIP
