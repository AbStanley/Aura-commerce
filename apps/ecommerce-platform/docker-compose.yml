services:
  # Infrastructure
  postgres:
    image: postgres:15-alpine
    container_name: ecommerce-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD required}
      POSTGRES_DB: ${POSTGRES_DB:-ecommerce_db}
    ports:
      - "5432:5432"
    networks:
      - ecommerce-network
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:alpine
    container_name: ecommerce-redis
    ports:
      - "6379:6379"
    networks:
      - ecommerce-network

  rabbitmq:
    image: rabbitmq:3-management
    container_name: ecommerce-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER:-guest}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS:?RABBITMQ_DEFAULT_PASS required}
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: [ "CMD", "rabbitmq-diagnostics", "-q", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - ecommerce-network

  seq:
    image: datalust/seq
    container_name: ecommerce-seq
    environment:
      ACCEPT_EULA: "Y"
      SEQ_FIRSTRUN_ADMINPASSWORD: ${SEQ_ADMIN_PASSWORD:?SEQ_ADMIN_PASSWORD required}
    ports:
      - "5341:5341"
      - "8091:80"
    networks:
      - ecommerce-network

  jaeger:
    image: jaegertracing/all-in-one:latest
    container_name: ecommerce-jaeger
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    ports:
      - "16686:16686" # Jaeger UI
      - "4317:4317" # OTLP gRPC
      - "4318:4318" # OTLP HTTP
    networks:
      - ecommerce-network

  # Microservices
  user-service:
    build:
      context: ../../
      dockerfile: apps/ecommerce-platform/services/UserService/Dockerfile
    container_name: user-service
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__DefaultConnection=Host=postgres;Port=5432;Database=ecommerce_users;Username=${POSTGRES_USER:-admin};Password=${POSTGRES_PASSWORD};
      - Jwt__Secret=${JWT_SECRET}
      - Jwt__Issuer=${JWT_ISSUER:-UserService}
      - Jwt__Audience=${JWT_AUDIENCE:-ECommercePlatform}
      - Seq__ServerUrl=http://seq:5341
      - OpenTelemetry__Endpoint=http://jaeger:4317
      - Authentication__Google__ClientId=${GOOGLE_CLIENT_ID}
      - Authentication__Google__ClientSecret=${GOOGLE_CLIENT_SECRET}
      - Authentication__GitHub__ClientId=${GITHUB_CLIENT_ID}
      - Authentication__GitHub__ClientSecret=${GITHUB_CLIENT_SECRET}
    ports:
      - "5001:8080"
    depends_on:
      - postgres
      - seq
    networks:
      - ecommerce-network

  product-service:
    build:
      context: ../../
      dockerfile: apps/ecommerce-platform/services/ProductCatalogService/Dockerfile
    container_name: product-service
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__DefaultConnection=Host=postgres;Port=5432;Database=ecommerce_products;Username=${POSTGRES_USER:-admin};Password=${POSTGRES_PASSWORD};
      - Jwt__Secret=${JWT_SECRET}
      - Jwt__Issuer=${JWT_ISSUER:-UserService}
      - Jwt__Audience=${JWT_AUDIENCE:-ECommercePlatform}
      - Seq__ServerUrl=http://seq:5341
      - OpenTelemetry__Endpoint=http://jaeger:4317
    ports:
      - "5002:8080"
    depends_on:
      - postgres
      - seq
    networks:
      - ecommerce-network

  cart-service:
    build:
      context: ../../
      dockerfile: apps/ecommerce-platform/services/ShoppingCartService/Dockerfile
    container_name: cart-service
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__Redis=redis:6379
      - Jwt__Secret=${JWT_SECRET}
      - Jwt__Issuer=${JWT_ISSUER:-UserService}
      - Jwt__Audience=${JWT_AUDIENCE:-ECommercePlatform}
      - Seq__ServerUrl=http://seq:5341
      - OpenTelemetry__Endpoint=http://jaeger:4317
    ports:
      - "5003:8080"
    depends_on:
      - redis
      - seq
    networks:
      - ecommerce-network

  order-service:
    build:
      context: ../../
      dockerfile: apps/ecommerce-platform/services/OrderService/Dockerfile
    container_name: order-service
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__DefaultConnection=Host=postgres;Port=5432;Database=ecommerce_orders;Username=${POSTGRES_USER:-admin};Password=${POSTGRES_PASSWORD};
      - RabbitMQ__Host=rabbitmq
      - RabbitMQ__UserName=${RABBITMQ_DEFAULT_USER:-guest}
      - RabbitMQ__Password=${RABBITMQ_DEFAULT_PASS}
      - Jwt__Secret=${JWT_SECRET}
      - Jwt__Issuer=${JWT_ISSUER:-UserService}
      - Jwt__Audience=${JWT_AUDIENCE:-ECommercePlatform}
      - Seq__ServerUrl=http://seq:5341
      - OpenTelemetry__Endpoint=http://jaeger:4317
    ports:
      - "5004:8080"
    depends_on:
      postgres:
        condition: service_started
      rabbitmq:
        condition: service_healthy
      seq:
        condition: service_started
    networks:
      - ecommerce-network

  payment-service:
    build:
      context: ../../
      dockerfile: apps/ecommerce-platform/services/PaymentService/Dockerfile
    container_name: payment-service
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__DefaultConnection=Host=postgres;Port=5432;Database=ecommerce_payments;Username=${POSTGRES_USER:-admin};Password=${POSTGRES_PASSWORD};
      - RabbitMQ__Host=rabbitmq
      - RabbitMQ__UserName=${RABBITMQ_DEFAULT_USER:-guest}
      - RabbitMQ__Password=${RABBITMQ_DEFAULT_PASS}
      - Jwt__Secret=${JWT_SECRET}
      - Jwt__Issuer=${JWT_ISSUER:-UserService}
      - Jwt__Audience=${JWT_AUDIENCE:-ECommercePlatform}
      - Seq__ServerUrl=http://seq:5341
      - Stripe__SecretKey=sk_test_mock
      - OpenTelemetry__Endpoint=http://jaeger:4317
    ports:
      - "5005:8080"
    depends_on:
      postgres:
        condition: service_started
      rabbitmq:
        condition: service_healthy
      seq:
        condition: service_started
    networks:
      - ecommerce-network

  notification-service:
    build:
      context: ../../
      dockerfile: apps/ecommerce-platform/services/NotificationService/Dockerfile
    container_name: notification-service
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__DefaultConnection=Host=postgres;Port=5432;Database=ecommerce_notifications;Username=${POSTGRES_USER:-admin};Password=${POSTGRES_PASSWORD};
      - RabbitMQ__Host=rabbitmq
      - RabbitMQ__UserName=${RABBITMQ_DEFAULT_USER:-guest}
      - RabbitMQ__Password=${RABBITMQ_DEFAULT_PASS}
      - Jwt__Secret=${JWT_SECRET}
      - Jwt__Issuer=${JWT_ISSUER:-UserService}
      - Jwt__Audience=${JWT_AUDIENCE:-ECommercePlatform}
      - Seq__ServerUrl=http://seq:5341
      - OpenTelemetry__Endpoint=http://jaeger:4317
    ports:
      - "5006:8080"
    depends_on:
      postgres:
        condition: service_started
      rabbitmq:
        condition: service_healthy
      seq:
        condition: service_started
    networks:
      - ecommerce-network

  gateway:
    build:
      context: ../../
      dockerfile: apps/ecommerce-platform/gateway/ApiGateway/Dockerfile
    container_name: api-gateway
    ports:
      - "5000:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - Seq__ServerUrl=http://seq:5341
      - Jwt__Secret=${JWT_SECRET}
      - Jwt__Issuer=${JWT_ISSUER:-UserService}
      - Jwt__Audience=${JWT_AUDIENCE:-ECommercePlatform}
      - ReverseProxy__Clusters__user-service__Destinations__destination1__Address=http://user-service:8080
      - OpenTelemetry__Endpoint=http://jaeger:4317
      - ReverseProxy__Clusters__product-service__Destinations__destination1__Address=http://product-service:8080
      - ReverseProxy__Clusters__cart-service__Destinations__destination1__Address=http://cart-service:8080
      - ReverseProxy__Clusters__order-service__Destinations__destination1__Address=http://order-service:8080
      - ReverseProxy__Clusters__payment-service__Destinations__destination1__Address=http://payment-service:8080
      - ReverseProxy__Clusters__notification-service__Destinations__destination1__Address=http://notification-service:8080
    depends_on:
      - user-service
      - product-service
      - cart-service
      - order-service
      - payment-service
      - notification-service
      - seq
    networks:
      - ecommerce-network

networks:
  ecommerce-network:
    driver: bridge

volumes:
  postgres_data:
